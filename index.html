<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Susanne Schamp</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary-color: #000000;
      --accent-color: #00000;
      --text-color: #333;
      --bg-color: #cc3b9;
    }

  body {
      margin: 0;
      padding: 0;
      background: var(--accent-color);
      font-family: "Segoe UI", sans-serif;
      color: var(--text-color);
    }

    .card {
      max-width: 400px;
      margin: 40px auto;
      background: var(--bg-color);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: start;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }

    .company-logo {
      height: 30px;
      margin-top:5px;
    }

    .info {
      text-align: left;
      margin-top: 15px;
    }

    .info h2 {
      margin: 5px 0;
      font-size: 1.2em;
    }

    .info p {
      margin: 3px 0;
      font-size: 0.95em;
    }

    .contact-icons {
      margin-top: 10px;
      font-size: 0.95em;
    }

    .contact-icons i {
      color: var(--primary-color);
      width: 20px;
    }

    .contact-icons p {
      display: flex;
      align-items: center;
      margin: 5px 0;
    }

    .add-contact-btn {
      display: block;
      margin: 20px auto;
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      border-radius: 10px;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    .action-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      gap: 10px;
    }

    .action-buttons a {
      flex: 1;
      background: var(--accent-color);
      padding: 12px 5px;
      text-align: center;
      border-radius: 10px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.85em;
    }

    .action-buttons i {
      display: block;
      font-size: 1.4em;
      margin-bottom: 5px;
      color: var(--primary-color);
    }

    .address {
      margin-top: 25px;
      font-size: 0.9em;
    }

    .address p {
      margin: 4px 0;
    }

    .address a {
      color: var(--primary-color);
      font-size: 0.85em;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img class="profile-img" src="profil.jpg" alt="Profilbild" />
      <img class="company-logo" src="logo.png" alt="Firmenlogo" />
    </div>

    <div class="info">
      <h2>Susanne Schamp</h2>
	<p>Dipl.-Ing. Architektin BDA Stadtplanerin DASL</p>
    </div>

    <div class="contact-icons">
      <p><i class="fas fa-phone"></i> +49 231 28662611</p>
      <p><i class="fas fa-mobile-alt"></i> +49 173 9154815</p>
      <p><i class="fas fa-envelope"></i> schamp@schamp-partner.de</p>
    </div>

</div>
</body>
</html>
